<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <title>Audiovis — abstract reflection logo</title>
  <desc>Two related but non-identical folded forms overlap to suggest music being reinterpreted as a visual experience.</desc>
  <defs>
    <linearGradient id="formA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.48" stop-color="#E8E8EB"/>
      <stop offset="1" stop-color="#777981"/>
    </linearGradient>
    <linearGradient id="formB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8ABB4"/>
      <stop offset="0.55" stop-color="#52545C"/>
      <stop offset="1" stop-color="#F2F2F4"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#BFC2CB" stop-opacity=".45"/>
    </linearGradient>
  </defs>

  <!-- Transparent background by design: suitable for app branding and overlays. -->
  <g transform="translate(0,-8)">
    <!-- Rear/reflected form: offset, darker, and slightly re-proportioned. -->
    <path d="M 642 290
             C 690 272, 735 292, 752 326
             C 770 361, 755 400, 721 425
             L 603 510
             C 570 534, 566 565, 588 592
             C 613 621, 652 642, 696 661
             C 731 676, 765 691, 796 705
             L 796 770
             C 743 751, 691 729, 642 704
             C 582 673, 536 638, 516 598
             C 496 557, 507 518, 548 488
             L 665 404
             C 685 390, 692 370, 683 351
             C 674 332, 657 319, 642 312 Z"
          fill="url(#formB)" opacity=".94"/>
    <!-- Front/original form: brighter and with a distinct, more upright edge. -->
    <path d="M 438 319
             C 438 289, 458 265, 487 250
             L 638 171
             L 638 401
             C 638 430, 625 451, 601 468
             L 511 531
             C 482 551, 448 547, 426 524
             C 405 502, 402 469, 420 446
             C 436 426, 462 411, 487 396
             L 526 373
             C 545 362, 553 345, 548 330
             C 542 312, 525 302, 506 307
             C 482 313, 460 326, 438 340 Z"
          fill="url(#formA)"/>
    <!-- A fine seam marks the point of transformation without becoming a literal mirror. -->
    <path d="M 638 171 L 638 401 C 638 430, 625 451, 601 468"
          fill="none" stroke="url(#edge)" stroke-width="2" opacity=".85"/>
  </g>

  <g fill="#F7F7F8" text-anchor="middle">
    <text x="600" y="890" font-family="Avenir Next, Montserrat, Helvetica, Arial, sans-serif"
          font-size="104" font-weight="400" letter-spacing="10">Audiovis</text>
    <text x="600" y="946" font-family="Avenir Next, Montserrat, Helvetica, Arial, sans-serif"
          font-size="19" font-weight="400" letter-spacing="8.5" opacity=".82">MUSIC PROJECT VISUALIZER</text>
  </g>
</svg>
